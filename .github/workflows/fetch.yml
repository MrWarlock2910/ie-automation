name: IE Automation Pipeline

on:
  schedule:
    - cron: '15 2 * * *'  # 02:15 UTC = 07:45 AM IST (Primary Morning Watcher Start)
    - cron: '15 3 * * *'  # 03:15 UTC = 08:45 AM IST (Backup Morning Watcher Start)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run ignoring delivery cache and active window'
        required: false
        default: false
        type: boolean

concurrency:
  group: ie-automation-group
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Evaluate Execution Window & IST Date
        id: ist-info
        run: |
          IST_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y')
          IST_HOUR=$(TZ='Asia/Kolkata' date +'%H')
          IST_MINUTE=$(TZ='Asia/Kolkata' date +'%M')
          IST_TIME_STR=$(TZ='Asia/Kolkata' date +'%H:%M:%S')

          echo "date=${IST_DATE}" >> $GITHUB_OUTPUT
          echo "UTC Execution Time: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          echo "IST Execution Time: ${IST_TIME_STR} (Date: ${IST_DATE})"

          H=$((10#$IST_HOUR))
          M=$((10#$IST_MINUTE))

          # Active window: 07:30 AM to 07:00 PM IST (07:30 - 19:00)
          if { [ "$H" -eq 7 ] && [ "$M" -ge 30 ]; } || { [ "$H" -ge 8 ] && [ "$H" -lt 19 ]; }; then
            echo "Within active execution window."
            echo "active=true" >> $GITHUB_OUTPUT
          else
            echo "Outside active window (07:30 - 19:00 IST)."
            echo "active=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Daily Delivery Cache
        id: delivery-cache
        if: ${{ !inputs.force && steps.ist-info.outputs.active == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .delivery_marker
          key: ie-delivered-${{ steps.ist-info.outputs.date }}

      - name: Check Execution Eligibility
        id: delivery-check
        run: |
          # 1. User manual override
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Execution forced by user input. Proceeding with pipeline."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Outside active hours (nighttime fast-skip)
          if [ "${{ steps.ist-info.outputs.active }}" != "true" ]; then
            echo "Current time is outside active hours (07:30 - 19:00 IST). Skipping execution."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Already delivered today (daily delivery cache hit or sentinel file)
          if [ "${{ steps.delivery-cache.outputs.cache-hit }}" = "true" ] || [ -f ".delivery_marker" ]; then
            echo "Today's edition (${{ steps.ist-info.outputs.date }}) was ALREADY delivered earlier today."
            echo "Skipping further execution to preserve resources and prevent Telegram MTProto rate limits."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Paper not recorded as delivered yet. Proceeding with automation pipeline."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.10
        if: steps.delivery-check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        if: steps.delivery-check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automation pipeline
        if: steps.delivery-check.outputs.skip != 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python main.py

      - name: Save Daily Delivery Cache
        if: steps.delivery-check.outputs.skip != 'true' && hashFiles('.delivery_marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .delivery_marker
          key: ie-delivered-${{ steps.ist-info.outputs.date }}
