name: IE Automation Pipeline

on:
  schedule:
    - cron: '15 2 * * *'  # 02:15 UTC = 07:45 AM IST (Primary Morning Watcher Start)
    - cron: '15 3 * * *'  # 03:15 UTC = 08:45 AM IST (Backup Morning Watcher Start)
  workflow_dispatch:

concurrency:
  group: ie-automation-group
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Print Execution Timestamps
        run: |
          echo "UTC Execution Time: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          echo "IST Execution Time: $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S %z')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automation pipeline
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python main.py
