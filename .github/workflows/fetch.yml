name: IE Automation Pipeline

on:
  schedule:
    - cron: '27 2 * * *'  # 02:27 UTC = 07:57 AM IST (Uncommon minute offset)
    - cron: '39 2 * * *'  # 02:39 UTC = 08:09 AM IST (Fallback 1)
    - cron: '51 2 * * *'  # 02:51 UTC = 08:21 AM IST (Fallback 2)
    - cron: '1 3 * * *'   # 03:01 UTC = 08:31 AM IST (Fallback 3)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Print Execution Timestamps
        run: |
          echo "UTC Execution Time: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          echo "IST Execution Time: $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S %z')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Execute automation pipeline
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python main.py
